# Example Wintermute configuration. Copy to wintermute.toml and edit.

[server]
telnet_port = 2323
tls_port    = 2424
http_port   = 8443       # used in milestone 6
public_host = "localhost"

[db]
path = "wintermute.db"

[log]
level  = "info"          # debug | info | warn | error
format = "text"          # text | json

[tls]
# mode = "self-signed" generates a long-lived dev cert at ~/.wintermute/dev-cert.pem
# mode = "files"       reads cert_path and key_path
# mode = "autocert"    provisions via Let's Encrypt; requires hostnames
mode = "self-signed"

# [tls] for autocert:
# mode      = "autocert"
# cache_dir = "/var/lib/wintermute/acme-cache"
# hostnames = ["mud.example.com"]

# File-transfer blob store (milestone 6+). The first install seeds a
# single area named `dropbox` (slug `dropbox`, everyone-may-read /
# everyone-may-write, admin-only manage) so uploads have somewhere to
# land. Admin Lua can create additional areas via
# `wintermute.file.area.create(...)` and audit reaped tokens / orphan
# blobs with the `@cleanup-files` in-game command.
#
# [files]
# root                       = "./blobs"
# max_upload_bytes           = 104857600       # 100 MiB; 0 means default
# janitor_interval_seconds   = 300
# janitor_blob_grace_seconds = 600

# Parsed but unused until milestone 3.
[llm.default]
backend = "ollama"

[llm.default.opts]
url              = "http://localhost:11434"
model            = "llama3.2:3b"
gate_model       = "llama3.2:1b"
summarizer_model = "llama3.2:1b"
embedding_model  = "nomic-embed-text"

# FidoNet Technology Network (FTN) membership (milestone 6+). Each
# [[ftn.network]] block is one network this server is a node on. If you
# don't declare any, a `local` network is auto-created at startup
# (domain `local`, address 255:255/255.0); local-only mail and boards
# live there. Set `default = true` on one network to make it the
# default for new boards. Mail between two accounts on this instance
# always uses the `local` network regardless of default.
#
# [[ftn.network]]
# slug    = "local"
# name    = "Local"
# domain  = "local"
# addr    = "255:255/255.0"
# default = true
#
# [[ftn.network]]
# slug    = "fidonet"
# name    = "FidoNet"
# domain  = "fidonet"
# addr    = "1:234/5.0"
#
# [[ftn.network]]
# slug    = "fsxnet"
# name    = "fsxNet"
# domain  = "fsxnet"
# addr    = "21:1/100.0"

# M6.6 login-hardening. The defaults below are what's compiled into the
# engine; uncomment and edit any field to override. Disabling
# `auto_deny_enabled` keeps the structured "ip flagged" log lines but
# stops the engine from inserting rows into ip_denials. The optional
# subtext-filter bridge (https://github.com/vaelen/subtext-filter)
# announces flagged IPv4 addresses on UDP for an upstream nft drop
# rule; leave `filter.enabled = false` if you're not running one.
#
# [security]
# auto_deny_enabled              = true
# auto_deny_ttl_seconds          = 300
# failed_password_threshold      = 5
# failed_password_window_seconds = 60
# eviction_interval_seconds      = 60
#
# [security.filter]
# enabled = false
# address = "127.0.0.1:1234"
